name: app-picker CI

# Build + unit-test the Color App Picker on every PR and push that touches it.
# The toolchain (JDK 17, Android SDK 34, Gradle bootstrap) comes from app-picker/flake.nix
# so CI matches local `nix develop` exactly. The committed Gradle wrapper pins Gradle 8.2.

on:
  push:
    branches: [master]
    paths:
      - 'app-picker/**'
      - '.github/workflows/app-picker-ci.yml'
  pull_request:
    paths:
      - 'app-picker/**'
      - '.github/workflows/app-picker-ci.yml'

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: app-picker-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app-picker

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      # Cache the Nix store (keyed on flake.lock) so the Android SDK derivation
      # isn't rebuilt/redownloaded every run. This is the single biggest CI speedup.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('app-picker/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      # Cache Gradle dependencies + the downloaded Gradle 8.2 distribution.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app-picker/**/*.gradle', 'app-picker/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests
        run: nix develop --command ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: nix develop --command ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app-picker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app-picker/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
