name: app-picker Release

# Build a release APK and publish a GitHub Release when a namespaced tag is pushed.
# Tag format: app-picker-v1.2.3  (namespaced because this is a monorepo).
#
#   git tag app-picker-v1.0.0 && git push origin app-picker-v1.0.0
#
# The APK is UNSIGNED. To ship a signed build, add a keystore + signingConfig in
# app/build.gradle and wire the secrets noted in the "Sign APK" step below.

on:
  push:
    tags:
      - 'app-picker-v*'

defaults:
  run:
    working-directory: app-picker

permissions:
  contents: write  # required to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('app-picker/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app-picker/**/*.gradle', 'app-picker/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK
        run: nix develop --command ./gradlew assembleRelease --no-daemon --stacktrace

      # --- Signing (optional) -------------------------------------------------
      # Once you add a signingConfig in app/build.gradle reading these env vars,
      # uncomment to produce a signed, store-ready APK:
      #
      #   env:
      #     KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      #     KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      #     KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      #     KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # ------------------------------------------------------------------------

      - name: Locate APK
        id: apk
        run: |
          path=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Found APK: $path"
          echo "path=app-picker/$path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
