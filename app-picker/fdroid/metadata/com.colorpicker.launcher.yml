Name: Color App Picker
Summary: A color-sorted app launcher
Description: |-
  Color App Picker is a home-screen launcher that arranges your installed apps by
  the dominant colour of their icons, laid out as a colour wheel you can search and
  scroll.

  Add this repo to the F-Droid client to receive updates automatically.
