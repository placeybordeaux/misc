plugins {
    id 'com.android.application'
}

// Version is injected by CI from the release tag (app-picker-vX.Y.Z); the fallbacks
// keep local/dev builds working. F-Droid and Play both require versionCode to
// increase on every published build.
def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def appVersionName = (project.findProperty('appVersionName') ?: '1.0').toString()

// Release signing is driven entirely by environment variables so no key material
// lives in the repo. When they're absent (local dev), the release build is left
// unsigned rather than failing.
def hasReleaseSigning = System.getenv('KEYSTORE_PASSWORD') != null

android {
    namespace 'com.colorpicker.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.colorpicker.launcher"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(System.getenv('KEYSTORE_FILE') ?: "${rootProject.projectDir}/release.keystore")
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
}
